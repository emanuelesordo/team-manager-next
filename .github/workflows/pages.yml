name: Validate & deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'fresh/**'
      - 'assets/**'
      - 'scripts/build.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test player profile calculations and presentation
        run: node --check fresh/roster-role-matrix.js && node --check fresh/roster-spreadsheet.js && node --check fresh/player-role-heatmap.js && node --check fresh/player-navigation.js && node --check fresh/player-infographic-overview.js && node --check fresh/player-intelligence.js && node --check fresh/analytics-ui.js && node --check fresh/main.js && node --check fresh/staff-ui.js && node --check fresh/callup-message.js && node --check fresh/callup-import-ui.js && node --test tests/roster-role-matrix.test.mjs tests/player-role-heatmap.test.mjs tests/player-navigation.test.mjs tests/player-infographic.test.mjs tests/player-intelligence.test.mjs tests/analytics-ui.scopes.test.mjs tests/callup-message.test.mjs
      - name: Test hypothetical lineup, affinities and ratings
        run: node --check fresh/pre-match-lineup.js && node --test tests/prematch-lineup.test.mjs
      - name: Test advanced Caselle event details
        run: node --check fresh/event-details.js && node --test tests/event-details.test.mjs
      - name: Test event detail statistics
        run: node --check fresh/event-detail-stats.js && node --test tests/event-detail-stats.test.mjs
      - name: Test rating timeline
        run: node --check fresh/rating-timeline.js && node --test tests/rating-timeline.test.mjs
      - name: Generate static site
        run: npm run build
      - name: Verify deploy artifact
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/fresh/main.js
          test -s dist/fresh/style.css
          test -s dist/fresh/flat-surfaces.css
          test -s dist/fresh/player-role-heatmap.js
          test -s dist/fresh/player-role-heatmap.css
          grep -q 'fresh/player-role-heatmap.css?v=' dist/index.html
          grep -q 'fresh/main.js?v=' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
