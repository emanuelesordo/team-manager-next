name: Validate & deploy Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate static site
        run: npm run build
      - name: Verify deploy artifact
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/fresh/main.js
          test -s dist/fresh/style.css
          test -s dist/fresh/flat-surfaces.css
          grep -q 'fresh/main.js?v=' dist/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
