name: Browser Match Center (mocked APIs)
on:
  push:
    branches: [main]
    paths:
      - 'fresh/**'
      - 'tests/match-browser.py'
      - '.github/workflows/match-browser.yml'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Start static test server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/team-manager-http.log 2>&1 &
          sleep 2
      - name: Run responsive browser test with simulated Supabase
        run: python tests/match-browser.py
