<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b0a">
  <meta name="description" content="Team Manager — risultati, classifiche, rosa e match center in tempo reale.">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="Team Manager">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/styles.css">
  <link rel="stylesheet" href="./src/layout-compact.css">
  <title>Team Manager · Club dashboard</title>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div><div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar glass" aria-label="Barra di navigazione desktop">
      <a class="brand" href="#home" data-nav="home" aria-label="Team Manager, vai alla Home">
        <span class="brand-mark">T<span class="brand-mark-accent">/</span>M</span>
        <span class="brand-copy"><strong>TEAM<br>MANAGER</strong><small>CLUB SYSTEM</small></span>
      </a>
      <div class="side-division"></div>
      <div class="sidebar-label">ESPLORA</div>
      <nav id="desktopNav" class="nav-list" aria-label="Navigazione principale"></nav>
      <div class="side-spacer"></div>
      <div class="sidebar-bottom">
        <div class="season-card"><small>STAGIONE</small><label for="seasonSelect" class="sr-only">Seleziona stagione</label><select id="seasonSelect" aria-label="Stagione sportiva"><option>Caricamento…</option></select></div>
        <button id="accountButton" class="account-button" type="button"><span class="account-avatar">↗</span><span class="account-label"><strong>Area personale</strong><small>Accedi</small></span><span class="account-chevron">›</span></button>
      </div>
    </aside>
    <div class="content-area">
      <header class="topbar">
        <div class="topbar-identity"><span class="mobile-brand-mark">T<span>/</span>M</span><span id="topbarLocation">Club overview</span><span class="topbar-slash">/</span><span id="topbarViewName">Home</span></div>
        <div class="topbar-actions"><button id="moreMobile" class="icon-button more-mobile" type="button" data-more aria-label="Mostra tutte le sezioni" title="Altre sezioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg></button><span class="connection" id="connectionStatus"><span class="connection-dot"></span> Connessione…</span><button id="refreshButton" type="button" class="icon-button" title="Aggiorna dati" aria-label="Aggiorna dati">↻</button><button id="mobileAccountButton" class="icon-button account-mobile" type="button" title="Area personale" aria-label="Area personale">♙</button></div>
      </header>
      <main id="view" tabindex="-1"><div class="initial-loading"><span class="spinner"></span><h1>Preparazione della stagione</h1><p>Collegamento ai dati della squadra…</p></div></main>
      <footer class="site-footer"><span>TEAM MANAGER <span class="footer-dot">●</span> CLUB SYSTEM</span><span>Dati sportivi sincronizzati con Supabase · Le informazioni mancanti non vengono stimate.</span></footer>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav glass" aria-label="Navigazione mobile"></nav>
  <dialog id="modal" class="dialog"><div id="dialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
