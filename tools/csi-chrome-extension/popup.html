<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI Scraper</title><style>
:root{color-scheme:dark}body{width:360px;max-height:600px;overflow:auto;margin:0;padding:18px;background:#10252b;color:#edf6f5;font:13px/1.5 system-ui,sans-serif;box-sizing:border-box}h1{font-size:18px;margin:0 0 5px}p{color:#a8c2c3;margin:7px 0 14px}button{border:1px solid #517477;border-radius:10px;background:#22444a;color:white;padding:10px;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.primary{background:#d2f68e;color:#13232a;font-weight:700;border:0}button:hover:not(:disabled){filter:brightness(1.12)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%;margin-top:8px}#status{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.4 ui-monospace,monospace;max-height:150px;overflow:auto}#status.error{color:#ffaaa8}#status.ok{color:#c3f28d}.small{font-size:11px}#results{margin-top:12px;max-height:150px;overflow:auto}</style></head>
<body><h1>CSI Live Scraper</h1><p>Apri una gara o un calendario CSI Live. I dati importati su Team Manager rimangono provvisori fino alla validazione.</p>
<div class="buttons"><button id="single" class="primary">Estrai pagina</button><button id="bulk">Estrai calendario</button></div>
<button id="export" class="full" disabled>Esporta JSON</button><button id="send" class="full" disabled>Invia alla partita aperta su Team Manager</button>
<div id="results"></div><p id="status" role="status">Pronto.</p><p class="small">Solo siti CSI Live. L'invio richiede una scheda Team Manager già aperta sul match corrispondente e una sessione admin valida.</p>
<script type="module" src="popup.js"></script></body></html>
